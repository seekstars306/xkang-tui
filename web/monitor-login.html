<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 飞书监控台</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family:-apple-system,"Microsoft YaHei",sans-serif; background:#f0f2f5; color:#1f2329; }
  .card { width:360px; background:#fff; border-radius:10px; padding:32px 30px 26px;
          box-shadow:0 4px 20px rgba(0,0,0,.07); }
  h1 { margin:0 0 6px; font-size:19px; font-weight:600; }
  .sub { margin:0 0 24px; font-size:12.5px; color:#86909c; }
  label { display:block; font-size:12.5px; color:#4e5969; margin-bottom:5px; }
  input { width:100%; padding:10px 12px; border:1px solid #d9dce1; border-radius:5px;
          font-size:14px; margin-bottom:15px; transition:border-color .15s; }
  input:focus { outline:none; border-color:#165dff; }
  button { width:100%; padding:10px; border:none; border-radius:5px; background:#165dff;
           color:#fff; font-size:14px; cursor:pointer; transition:background .15s; }
  button:hover { background:#0e42d2; }
  button:disabled { background:#a9c9ff; cursor:not-allowed; }
  .err { color:#f53f3f; font-size:12.5px; min-height:18px; margin-top:10px; }
</style>
</head>
<body>
<form class="card" id="f">
  <h1>飞书监控台</h1>
  <p class="sub">请使用管理员账号登录</p>
  <label for="u">用户名</label>
  <input id="u" name="username" autocomplete="username" autofocus>
  <label for="p">密码</label>
  <input id="p" name="password" type="password" autocomplete="current-password">
  <button id="b" type="submit">登录</button>
  <div class="err" id="e"></div>
</form>
<script>
const f = document.getElementById('f'), e = document.getElementById('e'), b = document.getElementById('b');
f.onsubmit = async ev => {
  ev.preventDefault();
  e.textContent = ''; b.disabled = true; b.textContent = '登录中…';
  try {
    const r = await fetch('/admin/feishu/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: document.getElementById('u').value.trim(), password: document.getElementById('p').value }),
    });
    const j = await r.json().catch(()=>({}));
    if (r.ok) { location.href = '/admin/feishu'; return; }
    e.textContent = j.error || ('登录失败（HTTP ' + r.status + '）');
  } catch { e.textContent = '网络异常，请重试'; }
  b.disabled = false; b.textContent = '登录';
};
</script>
</body>
</html>
